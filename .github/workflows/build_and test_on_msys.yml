name: MSYS

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/**'
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build_gcc_cmake:
    name: gcc and cmake
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # mingw-w64-x86_64-cairo mingw-w64-x86_64-pango
      - name: Setup MSYS/MINGW64
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: "mingw-w64-x86_64-toolchain mingw-w64-x86_64-libtool
                    mingw-w64-x86_64-cmake mingw-w64-x86_64-extra-cmake-modules mingw-w64-x86_64-ninja
                    jq
                    mingw-w64-x86_64-catch
                    mingw-w64-x86_64-protobuf
                    mingw-w64-x86_64-libxml2
                    mingw-w64-x86_64-nlohmann-json
                    mingw-w64-x86_64-cairo mingw-w64-x86_64-pango
                    mingw-w64-x86_64-qt5
                    mingw-w64-x86_64-glew mingw-w64-x86_64-glfw mingw-w64-x86_64-glm
                    mingw-w64-x86_64-libpng
                    mingw-w64-x86_64-skia
                    mingw-w64-x86_64-directx-headers"
      - name: Provide the font the font-dependent tests measure against
        run: |
          mkdir -p "${MINGW_PREFIX}/share/fonts/TTF"
          cp "libosmscout-map-opengl/data/fonts/LiberationSans-Regular.ttf" \
             "${MINGW_PREFIX}/share/fonts/TTF/"
          fc-cache -f "${MINGW_PREFIX}/share/fonts/TTF"
      - name: Verify the font and locale environment
        run: |
          echo "locale: LANG=${LANG-} LC_ALL=${LC_ALL-}"
          if command -v locale >/dev/null 2>&1; then
            locale
          fi
          echo "fonts visible: $(fc-list | wc -l)"
          echo "sans-serif resolves to: $(fc-match -f '%{file}' sans-serif)"
          resolved="$(fc-match -f '%{file}' 'Liberation Sans')"
          echo "Liberation Sans resolves to: ${resolved}"
          case "${resolved}" in
            *LiberationSans-Regular.ttf)
              ;;
            *)
              echo "::error::the font family 'Liberation Sans' resolves to '${resolved}' instead of the repository font, so the font-dependent tests would measure a fallback font"
              exit 1
              ;;
          esac
      - name: Configure build project
        run: DXSDK_DIR=${MINGW_PREFIX}/${MINGW_CHOST} cmake -B build -DCMAKE_UNITY_BUILD=ON -DOSMSCOUT_BUILD_CLIENT_JAVA=OFF -Wno-dev -G "Ninja"
      - name: Build project
        run: cmake --build build
      - name: Run tests
        run: LC_ALL=C env "PATH=$PATH:$PWD/libosmscout:$PWD/libosmscout-import:$PWD/libosmscout-map:$PWD/libosmscout-map-skia:$PWD/libosmscout-map-svg:$PWD/libosmscout-test:$PWD/libosmscout-client:$PWD/libosmscout-map-cairo:$PWD/libosmscout-map-agg:$PWD/libosmscout-map-directx:$PWD/libosmscout-map-gdi:$PWD/libosmscout-gpx:$PWD/libosmscout-client-qt:${MINGW_PREFIX}/bin" ctest -j 4 --output-on-failure --exclude-regex PerformanceTest
        env:
          LANG: en_US.utf8
        working-directory: build

  build_gcc_meson:
    name: gcc and meson
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup MSYS/MINGW64
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: "mingw-w64-x86_64-toolchain mingw-w64-x86_64-libtool
                    mingw-w64-x86_64-meson mingw-w64-x86_64-ninja
                    jq
                    mingw-w64-x86_64-catch
                    mingw-w64-x86_64-protobuf
                    mingw-w64-x86_64-libxml2
                    mingw-w64-x86_64-nlohmann-json
                    mingw-w64-x86_64-cairo mingw-w64-x86_64-pango
                    mingw-w64-x86_64-qt5
                    mingw-w64-x86_64-glew mingw-w64-x86_64-glfw mingw-w64-x86_64-glm
                    mingw-w64-x86_64-libpng
                    mingw-w64-x86_64-skia
                    mingw-w64-x86_64-directx-headers"
      - name: Provide the font the font-dependent tests measure against
        run: |
          mkdir -p "${MINGW_PREFIX}/share/fonts/TTF"
          cp "libosmscout-map-opengl/data/fonts/LiberationSans-Regular.ttf" \
             "${MINGW_PREFIX}/share/fonts/TTF/"
          fc-cache -f "${MINGW_PREFIX}/share/fonts/TTF"
      - name: Verify the font and locale environment
        run: |
          echo "locale: LANG=${LANG-} LC_ALL=${LC_ALL-}"
          if command -v locale >/dev/null 2>&1; then
            locale
          fi
          echo "fonts visible: $(fc-list | wc -l)"
          echo "sans-serif resolves to: $(fc-match -f '%{file}' sans-serif)"
          resolved="$(fc-match -f '%{file}' 'Liberation Sans')"
          echo "Liberation Sans resolves to: ${resolved}"
          case "${resolved}" in
            *LiberationSans-Regular.ttf)
              ;;
            *)
              echo "::error::the font family 'Liberation Sans' resolves to '${resolved}' instead of the repository font, so the font-dependent tests would measure a fallback font"
              exit 1
              ;;
          esac
      - name: Configure build project
        run: meson setup --buildtype debugoptimized --unity on debug
        env:
          CXX: ccache g++
          CC: ccache gcc
      - name: Build project
        run: meson compile -C debug
      - name: Run tests
        run: "LC_ALL=C
              meson test --timeout-multiplier 2 -C debug --print-errorlogs"
        env:
          LANG: en_US.utf8
