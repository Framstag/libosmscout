name: OS X

# A change to this workflow's own file runs it: the negation keeps the other
# workflows out, the last entry re-includes this file. Without it, a merge that
# only touches this file would be skipped here and never be exercised.
on:
  pull_request:
    branches:
      - master
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/build_and test_on_osx.yml'
  push:
    branches:
      - master
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/build_and test_on_osx.yml'
  workflow_dispatch:

jobs:
  build_meson:
    name: meson
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install build tool
        run: brew install meson ninja
      - name: Install dependencies
        run: brew install openjdk catch2 protobuf protobuf-c qt@5 cairo libxml2 nlohmann-json gettext pango glfw glew glm libpng pkgconfig jq
      - name: Install Liberation fonts (needed by text metrics tests)
        run: brew install --cask font-liberation
      - name: Configure build project
        run: meson setup --buildtype debugoptimized --unity on debug -Dopenmp=false
        env:
          PKG_CONFIG_PATH: "/usr/local/opt/qt@5/lib/pkgconfig:/usr/local/opt/libxml2/lib/pkgconfig"
      - name: Build project
        run: meson compile -C debug
      - name: Execute tests
        run: meson test --timeout-multiplier 2 -C debug --print-errorlogs

  build_cmake:
    name: cmake
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install build tool
        run:  brew install cmake ninja
      - name: Install dependencies
        run: brew install openjdk catch2 protobuf protobuf-c qt@5 cairo libxml2 nlohmann-json gettext pango glfw glew glm libpng pkgconfig jq
      - name: Install Liberation fonts (needed by text metrics tests)
        run: brew install --cask font-liberation
      - name: Configure build project
        run: cmake -B build -DQt5_DIR=$(brew --prefix qt@5)/lib/cmake/Qt5 -DPNG_PNG_INCLUDE_DIR=$(brew --prefix libpng)/include -DPNG_LIBRARY=$(brew --prefix libpng)/lib/libpng.dylib -DCMAKE_UNITY_BUILD=ON -DOSMSCOUT_BUILD_CLIENT_JAVA=OFF -Wno-dev -G "Ninja"
        env:
          PKG_CONFIG_PATH: "/usr/local/opt/qt@5/lib/pkgconfig:/usr/local/opt/libxml2/lib/pkgconfig"
      - name: Build project
        run: cmake --build build
      - name: Run tests
        run: ctest -j 2 --output-on-failure --exclude-regex PerformanceTest-opengl
        working-directory: build
