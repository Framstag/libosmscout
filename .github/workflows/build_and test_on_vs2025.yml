name: Visual Studio 2025

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_cmake:
    name: cmake
    runs-on: windows-2025
    permissions:
      contents: read
      actions: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Copy vcpkg.json
        run:  copy vcpkg_medium.json vcpkg.json
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      # Prepare MSVC dev environment (cl.exe, INCLUDE, LIB) so the Ninja generator
      # picks MSVC instead of the MinGW toolchain found in the runner PATH.
      - name: Prepare MSVC
        uses: bus1/cabuild/action/msdevshell@v1
        with:
          architecture: x64
        # Download and build vcpkg, without installing any port. If content is cached already, it is a no-op.
      - name: Restore from cache and install vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          runVcpkgInstall: false
          doNotCache: false
          vcpkgJsonGlob: 'vcpkg.json'
          vcpkgGitCommitId: 55fab67aea1027f7179ae6b5c54a5ba9091c16aa # Source from 29.12.2025 (should be something like https://github.com/microsoft/vcpkg/releases/tag/2025.12.12)
      # vcpkg binary cache: built packages are stored as NuGet packages in the GitHub Packages
      # feed (nuget.pkg.github.com). Each package is versioned by its ABI hash, so a runner
      # image/toolchain update produces new versions and the cache self-heals; manifest changes
      # only rebuild the affected ports. The GITHUB_TOKEN is written to the runner-local
      # NuGet.config (outside the repo checkout) and the runner is destroyed after the job.
      - name: Configure NuGet source for vcpkg binary cache
        shell: pwsh
        env:
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nuget = $(${{ github.workspace }}/vcpkg/vcpkg.exe fetch nuget)
          & $nuget sources add `
            -ConfigFile "$env:APPDATA\NuGet\NuGet.Config" `
            -Source "https://nuget.pkg.github.com/Framstag/index.json" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "Framstag" `
            -Password "$env:NUGET_TOKEN"
          & $nuget setapikey "$env:NUGET_TOKEN" `
            -ConfigFile "$env:APPDATA\NuGet\NuGet.Config" `
            -Source "https://nuget.pkg.github.com/Framstag/index.json"
      # Override run-vcpkg's default VCPKG_BINARY_SOURCES (x-gha was removed from vcpkg-tool)
      # and point vcpkg's binary cache at the GitHub Packages NuGet feed.
      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;nuget,https://nuget.pkg.github.com/Framstag/index.json,readwrite" >> $env:GITHUB_ENV
          echo "VCPKG_NUGET_REPOSITORY=https://nuget.pkg.github.com/Framstag/index.json" >> $env:GITHUB_ENV
      - name: Create build directory
        run:  mkdir build
      - name: Configure build project
        run: cmake -G "Ninja" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DOSMSCOUT_BUILD_DOC_API=OFF -DCMAKE_SYSTEM_VERSION=10.0.26100.0 -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake -Wno-dev ..
        working-directory: build
      - name: Build project
        run: cmake --build build
      - name: Create distribution directory
        run:  mkdir dist
      - name: Collect libosmscout
        run: copy /Y build\libosmscout\*.dll dist
        shell: cmd
      - name: Collect libosmscout-import
        run: copy /Y build\libosmscout-import\*.dll dist
        shell: cmd
      - name: Collect libosmscout-map
        run: copy /Y build\libosmscout-map\*.dll dist
        shell: cmd
#      - name: Collect libosmscout-map-cairo
#        run: copy /Y build\libosmscout-map-cairo\Debug\*.dll dist
#        shell: cmd
      - name: Collect libosmscout-map-directx
        run: copy /Y build\libosmscout-map-directx\*.dll dist
        shell: cmd
      - name: Collect libosmscout-map-gdi
        run: copy /Y build\libosmscout-map-gdi\*.dll dist
        shell: cmd
      - name: Collect libosmscout-map-svg
        run: copy /Y build\libosmscout-map-svg\*.dll dist
        shell: cmd
      - name: Collect Import
        run: copy /Y build\Import\*.exe dist
        shell: cmd
      - name: Collect Demos
        run: copy /Y build\Demos\*.exe dist
        shell: cmd
      - name: Upload distribution archive
        uses: actions/upload-artifact@v7
        with:
          name: Libosmscout_Windows.zip
          path: dist

  build_meson:
    name: meson
    runs-on: windows-2025
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python 3.x for meson
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install meson and ninja
        run:  pip install meson ninja
      - name: Prepare MSVC
        uses: bus1/cabuild/action/msdevshell@v1
        with:
          architecture: x64
      - name: Configure build project
        run:  meson setup --buildtype debugoptimized --wrap-mode nofallback --unity on -DenableXML=false -Dcpp_std=vc++latest build
      - name: Dump found dependencies
        run:  meson introspect --dependencies
        working-directory: build
      - name: Build project
        run:  meson compile -C build
      - name: Test project
        run:  meson test --timeout-multiplier 2 -C build --print-errorlogs
