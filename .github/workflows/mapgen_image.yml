name: Mapgen image

on:
  pull_request:
    branches:
      - master
    paths:
      - 'scripts/mapgen/**'
      - 'Import/**'
      - 'libosmscout-import/**'
      - 'libosmscout/**'
      - 'stylesheets/map.ost'
      - '.dockerignore'
      - '.github/workflows/mapgen_image.yml'
  push:
    branches:
      - master
    paths:
      - 'scripts/mapgen/**'
      - 'Import/**'
      - 'libosmscout-import/**'
      - 'libosmscout/**'
      - 'stylesheets/map.ost'
      - '.dockerignore'
      - '.github/workflows/mapgen_image.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Publish the images to the container registry (the tags come from the source)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  # How many builds of each image to keep; older ones are pruned after a
  # publication, so a build stamp stays pullable for this many publications.
  KEEP_BUILDS: '20'

# Runs for the same ref are serialized; a published tag is never moved by an
# overlapping run.
concurrency:
  group: mapgen-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build mapgen image and smoke test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      library_version: ${{ steps.versions.outputs.library_version }}
      created: ${{ steps.versions.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read and cross-check the library version
        id: versions
        run: |
          set -euo pipefail
          # The library version is what the import tool reports, what db.json
          # records as import.version and what the images are tagged with. It is
          # declared once per build system, and both declarations must agree or
          # the two build systems would report different versions.
          cmake_version=$(sed -nE 's/^set\(OSMSCOUT_LIBRARY_VERSION ([^)]*)\).*/\1/p' CMakeLists.txt)
          meson_version=$(sed -nE "s/^libraryVersion='([^']*)'.*/\1/p" meson.build)
          if [ -z "${cmake_version}" ] || [ -z "${meson_version}" ]; then
            echo "cannot read the library version from CMakeLists.txt or meson.build" >&2
            exit 1
          fi
          if [ "${cmake_version}" != "${meson_version}" ]; then
            echo "library version mismatch: CMakeLists.txt declares '${cmake_version}', meson.build declares '${meson_version}'" >&2
            exit 1
          fi
          {
            echo "library_version=${cmake_version}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "library version: ${cmake_version}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/mapgen/Dockerfile
          load: true
          tags: osmscout-mapgen:test
          build-args: |
            OSMSCOUT_REVISION=${{ github.sha }}
            OSMSCOUT_VERSION=${{ steps.versions.outputs.library_version }}
            OSMSCOUT_CREATED=${{ steps.versions.outputs.created }}
          cache-from: type=gha,scope=mapgen
          cache-to: type=gha,mode=max,scope=mapgen

      - name: Verify the runtime identity
        run: |
          test "$(docker run --rm --entrypoint id osmscout-mapgen:test -u)" = "1000"
          test "$(docker run --rm --entrypoint id osmscout-mapgen:test -g)" = "1000"

      - name: Verify the image reports the version it was built from
        env:
          LIBRARY_VERSION: ${{ steps.versions.outputs.library_version }}
        run: |
          reported=$(docker run --rm --entrypoint /usr/local/bin/Import osmscout-mapgen:test --tool-version)
          if [ "${reported}" != "${LIBRARY_VERSION}" ]; then
            echo "the image reports version '${reported}' but the source declares '${LIBRARY_VERSION}'" >&2
            exit 1
          fi
          echo "the image reports library version ${reported}"

      - name: Smoke test (config check)
        run: |
          mkdir -p /tmp/mapgen-config
          cat > /tmp/mapgen-config/imports.json <<'EOF'
          {"schema":1,"history":2,"refresh":7,"imports":[{"id":"berlin","url":"https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf"}]}
          EOF
          mkdir -p /tmp/mapgen-repo/public
          cat > /tmp/mapgen-repo/public/names.json <<'EOF'
          {"schema":1,"regions":[{"id":"europe","names":{"en":"Europe"},"children":[{"id":"germany","names":{"en":"Germany"},"children":[{"id":"berlin","names":{"en":"Berlin"}}]}]}]}
          EOF
          docker run --rm --read-only \
            -v /tmp/mapgen-config:/config:ro \
            -v /tmp/mapgen-work:/work \
            -v /tmp/mapgen-repo:/repository \
            osmscout-mapgen:test --check-config

      - name: Smoke test (single pass, refresh gate, no network)
        run: |
          mkdir -p /tmp/mapgen-repo/private/admin /tmp/mapgen-work
          echo '{"lastCheckedAt":'$(date +%s)',"lastSeenSourceMd5":""}' > /tmp/mapgen-repo/private/admin/berlin_check.json
          # The container runs as uid 1000 by default while host-mounted volumes
          # are owned by the runner user; grant ownership here or the mapgen
          # pass cannot create private/staging or write to /work.
          sudo chown -R 1000:1000 /tmp/mapgen-repo /tmp/mapgen-work /tmp/mapgen-config
          docker run --rm --read-only \
            -v /tmp/mapgen-config:/config:ro \
            -v /tmp/mapgen-work:/work \
            -v /tmp/mapgen-repo:/repository \
            osmscout-mapgen:test

      - name: Smoke test (single pass as an overridden uid/gid)
        run: |
          # The identity is configurable (PUID/PGID in the compose file, --user on
          # the command line). This run proves a pass works as an identity that has
          # no entry in the image's /etc/passwd, and that what it writes carries
          # that identity.
          mkdir -p /tmp/mapgen-config-alt /tmp/mapgen-work-alt /tmp/mapgen-repo-alt/public /tmp/mapgen-repo-alt/private/admin
          cp /tmp/mapgen-config/imports.json /tmp/mapgen-config-alt/
          cp /tmp/mapgen-repo/public/names.json /tmp/mapgen-repo-alt/public/
          echo '{"lastCheckedAt":'$(date +%s)',"lastSeenSourceMd5":""}' > /tmp/mapgen-repo-alt/private/admin/berlin_check.json
          sudo chown -R 1234:1234 /tmp/mapgen-config-alt /tmp/mapgen-work-alt /tmp/mapgen-repo-alt
          docker run --rm --read-only --user 1234:1234 \
            -v /tmp/mapgen-config-alt:/config:ro \
            -v /tmp/mapgen-work-alt:/work \
            -v /tmp/mapgen-repo-alt:/repository \
            osmscout-mapgen:test
          # staging is created by the pass itself, so its owner is the identity the
          # pass actually ran as
          test "$(stat -c '%u:%g' /tmp/mapgen-repo-alt/private/staging)" = "1234:1234"
          echo "the pass wrote with the identity it was given"

  publish:
    name: Publish images
    runs-on: ubuntu-24.04
    needs: verify
    # A pull request never publishes; a commit on the main branch and a manual
    # run do. There is no release-specific publication: the commit that sets a
    # new release version publishes like any other.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.push)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Runs before the login: it only reads the source.
      - name: Read the release version
        id: release
        run: |
          set -euo pipefail
          # The release version names the release and the distribution archives,
          # and it is the version the images are tagged with. A milestone sets it
          # in the tree (see Documentation/MapRepository.md, section 5); while it
          # still holds the literal 'latest' the images carry only the build
          # stamp and the latest tag.
          declared=$(sed -nE "s/^ *version: *'([^']*)',.*/\1/p" meson.build | head -1)
          release_version=""
          if echo "${declared}" | grep -qE '^[0-9]+[.][0-9]+[.][0-9]+([.][0-9]+)?(-[A-Za-z0-9.-]+)?$'; then
            release_version="${declared}"
          else
            echo "the source declares no release version ('${declared}'): publishing the latest tag and the build stamp only"
          fi
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine the image tags
        id: tags
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          # A container registry requires a lower case name; GitHub expressions
          # cannot lower case, so the namespace is normalized here.
          namespace=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          # A stamp identifies this one publication: it never moves, so it is the
          # tag to pin when a deployment has to be reproducible. It is pruned
          # after KEEP_BUILDS publications, which the documentation states.
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          if [ -n "${RELEASE_VERSION}" ]; then
            tags=$(printf '%s\n%s\n%s' "${RELEASE_VERSION}" "latest" "${stamp}")
          else
            tags=$(printf '%s\n%s' "latest" "${stamp}")
          fi
          mapgen_tags=""
          mapserve_tags=""
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            mapgen_tags="${mapgen_tags}${REGISTRY}/${namespace}/mapgen:${tag}"$'\n'
            mapserve_tags="${mapserve_tags}${REGISTRY}/${namespace}/mapserve:${tag}"$'\n'
          done <<< "${tags}"
          {
            echo "mapgen_tags<<TAGS"
            echo "${mapgen_tags}"
            echo "TAGS"
            echo "mapserve_tags<<TAGS"
            echo "${mapserve_tags}"
            echo "TAGS"
            echo "stamp=${stamp}"
          } >> "$GITHUB_OUTPUT"
          echo "publishing:"
          echo "${mapgen_tags}"
          echo "${mapserve_tags}"

      - name: Publish mapgen image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/mapgen/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.mapgen_tags }}
          build-args: |
            OSMSCOUT_REVISION=${{ github.sha }}
            OSMSCOUT_VERSION=${{ steps.release.outputs.release_version || needs.verify.outputs.library_version }}
            OSMSCOUT_CREATED=${{ needs.verify.outputs.created }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=mapgen
          cache-to: type=gha,mode=max,scope=mapgen

      - name: Publish mapserve image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/mapgen/Dockerfile.serve
          push: true
          tags: ${{ steps.tags.outputs.mapserve_tags }}
          build-args: |
            OSMSCOUT_REVISION=${{ github.sha }}
            OSMSCOUT_VERSION=${{ steps.release.outputs.release_version || needs.verify.outputs.library_version }}
            OSMSCOUT_CREATED=${{ needs.verify.outputs.created }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=mapserve
          cache-to: type=gha,mode=max,scope=mapserve

      # Keeps the number of published builds bounded: the newest KEEP_BUILDS
      # package versions of each image survive, older ones - and with them their
      # build stamps - are deleted. `latest` and the release version tag always
      # point at the newest publication, which is never a candidate.
      # The package name is the image path below the registry host, so it
      # includes the repository: ghcr.io/framstag/libosmscout/mapgen is the
      # package "libosmscout/mapgen". Naming it just "mapgen" fails with
      # "Package not found".
      - name: Prune older mapgen builds
        uses: actions/delete-package-versions@v5
        with:
          package-name: libosmscout/mapgen
          package-type: container
          min-versions-to-keep: ${{ env.KEEP_BUILDS }}

      - name: Prune older mapserve builds
        uses: actions/delete-package-versions@v5
        with:
          package-name: libosmscout/mapserve
          package-type: container
          min-versions-to-keep: ${{ env.KEEP_BUILDS }}

      - name: Report the published packages
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          STAMP: ${{ steps.tags.outputs.stamp }}
          KEEP: ${{ env.KEEP_BUILDS }}
        run: |
          {
            echo "### Published images"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.mapgen_tags }}"
            echo "${{ steps.tags.outputs.mapserve_tags }}"
            echo '```'
            echo
            echo "Pin a build with \`${STAMP}\`. It stays pullable for the next ${KEEP} publications;"
            echo "\`latest\` and the release version tag follow the newest publication."
            echo
            if [ -z "${RELEASE_VERSION}" ]; then
              echo "The source declares no release version, so no version tag was published."
              echo "Set one in \`meson.build\` when the next milestone is prepared."
              echo
            fi
            echo "A newly published package is private. Make it public once in its"
            echo "settings so that anonymous pulls work:"
            echo "- https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/mapgen/settings"
            echo "- https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/mapserve/settings"
          } >> "$GITHUB_STEP_SUMMARY"

  compose:
    name: Compose smoke (mapgen + serve)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify the configured runtime identity is rendered
        run: |
          default_user=$(docker compose -f scripts/mapgen/docker-compose.yml config --format json | jq -r '.services.mapgen.user')
          test "${default_user}" = "1000:1000"
          configured_user=$(PUID=1234 PGID=1234 docker compose -f scripts/mapgen/docker-compose.yml config --format json | jq -r '.services.mapgen.user')
          test "${configured_user}" = "1234:1234"
          serve_user=$(docker compose -f scripts/mapgen/docker-compose.yml config --format json | jq -r '.services.serve.user // "unset"')
          test "${serve_user}" = "unset"
          echo "mapgen renders ${default_user} by default and ${configured_user} with PUID/PGID set; serve keeps its image's identity"

      - name: Build images
        run: docker compose -f scripts/mapgen/docker-compose.yml build

      - name: Prepare config and seed repository volume
        run: |
          mkdir -p scripts/mapgen/config /tmp/mapgen-seed/public/europe/germany/berlin/v9
          cat > scripts/mapgen/config/imports.json <<'EOF'
          {"schema":1,"history":2,"refresh":7,"imports":[{"id":"berlin","url":"https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf"}]}
          EOF
          cat > /tmp/mapgen-seed/public/names.json <<'EOF'
          {"schema":1,"regions":[{"id":"europe","names":{"en":"Europe"},"children":[{"id":"germany","names":{"en":"Germany"},"children":[{"id":"berlin","names":{"en":"Berlin"}}]}]}]}
          EOF
          cat > /tmp/mapgen-seed/public/europe/germany/berlin/v9/db.json <<'EOF'
          {"schema":1,"typeConfigVersion":9,"generatedAt":"2026-01-01T00:00:00Z","output":{"files":{"map.lib":{"size":1,"crc32":2363233923}}}}
          EOF
          printf 'x' > /tmp/mapgen-seed/public/europe/germany/berlin/v9/map.lib
          docker compose -f scripts/mapgen/docker-compose.yml run --rm --user root \
            -v /tmp/mapgen-seed:/seed:ro --entrypoint sh mapgen -c \
            'mkdir -p /repository /work && cp -r /seed/public /repository/ && chown -R 1000:1000 /repository /work'

      - name: Start web server and verify HTTP behavior
        run: |
          docker compose -f scripts/mapgen/docker-compose.yml up -d serve
          sleep 3
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/names.json)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/europe/germany/berlin/v9/db.json)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/europe/germany/berlin/v9/map.lib)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/private/admin/x)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/staging/x)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/europe/)" = "404"

      - name: Config check and refresh-gated pass via mapgen container
        run: |
          docker compose -f scripts/mapgen/docker-compose.yml run --rm mapgen --check-config
          echo '{"lastCheckedAt":'$(date +%s)',"lastSeenSourceMd5":""}' > /tmp/mapgen-seed/check.json
          docker compose -f scripts/mapgen/docker-compose.yml run --rm --user root \
            -v /tmp/mapgen-seed:/seed:ro --entrypoint sh mapgen -c \
            'mkdir -p /repository/private/admin && cp /seed/check.json /repository/private/admin/berlin_check.json && chown -R 1000:1000 /repository'
          docker compose -f scripts/mapgen/docker-compose.yml run --rm mapgen
