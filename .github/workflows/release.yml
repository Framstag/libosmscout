name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (chronological, e.g. 2026.01.15.1); names the release and the distribution archives'
        required: true
      library_version:
        description: 'Library version of this release (major.minor.patch, e.g. 1.2.0); must differ from the current one and from the release version'
        required: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRO: 'zulu'

jobs:
  create_release:
    name: Create release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Install gcc compiler and Co
        run:  sudo apt-get -y install gcc g++ libtbb-dev ccache libtool pkg-config nlohmann-json3-dev

      - name: Install meson and ninja via pip
        run:  "pip install meson ninja"

      - name: Verify the released versions
        run:  |
          VERSION=${{ github.event.inputs.version }}
          LIBRARY_VERSION=${{ github.event.inputs.library_version }}

          # The version changes travel in a pull request, because branch
          # protection requires one and a workflow pushing with GITHUB_TOKEN
          # cannot bypass it. This step therefore asserts instead of editing:
          # the revision being released has to declare both versions, or the
          # tag, the archives and the container images would disagree with each
          # other. See Documentation/MapRepository.md, section 5.
          if ! echo "${LIBRARY_VERSION}" | grep -qE '^[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "library version '${LIBRARY_VERSION}' must have three numeric components (major.minor.patch)" >&2
            exit 1
          fi
          if [ "${LIBRARY_VERSION}" = "${VERSION}" ]; then
            echo "library version '${LIBRARY_VERSION}' must differ from the release version '${VERSION}'" >&2
            exit 1
          fi

          declared_release_version=$(sed -nE "s/^ *version: *'([^']*)',.*/\1/p" meson.build | head -1)
          if [ "${declared_release_version}" != "${VERSION}" ]; then
            echo "this revision declares release version '${declared_release_version}', not '${VERSION}': set it in meson.build first" >&2
            exit 1
          fi

          declared_cmake=$(sed -nE 's/^set\(OSMSCOUT_LIBRARY_VERSION ([^)]*)\).*/\1/p' CMakeLists.txt)
          declared_meson=$(sed -nE "s/^libraryVersion='([^']*)'.*/\1/p" meson.build)
          if [ -z "${declared_cmake}" ] || [ -z "${declared_meson}" ]; then
            echo "cannot read the library version from CMakeLists.txt or meson.build" >&2
            exit 1
          fi
          if [ "${declared_cmake}" != "${declared_meson}" ]; then
            echo "library version mismatch: CMakeLists.txt declares '${declared_cmake}', meson.build declares '${declared_meson}'" >&2
            exit 1
          fi
          if [ "${declared_cmake}" != "${LIBRARY_VERSION}" ]; then
            echo "this revision declares library version '${declared_cmake}', not '${LIBRARY_VERSION}': merge a version bump first" >&2
            exit 1
          fi

          previous_tag=$(git tag --list 'v*' --sort=-creatordate | head -1 || true)
          if [ -n "${previous_tag}" ]; then
            previous_library_version=$(git show "${previous_tag}:CMakeLists.txt" | sed -nE 's/^set\(OSMSCOUT_LIBRARY_VERSION ([^)]*)\).*/\1/p')
            if [ "${previous_library_version}" = "${LIBRARY_VERSION}" ]; then
              echo "library version '${LIBRARY_VERSION}' is the one release ${previous_tag} already reports: bump it" >&2
              exit 1
            fi
            echo "previous release ${previous_tag} reports library version ${previous_library_version}"
          else
            echo "no previous release tag found, skipping the consecutive-release check"
          fi

          echo "releasing ${VERSION}, library version ${LIBRARY_VERSION}"

      - name: Initialize meson project
        run:  meson setup dist --wrap-mode nofallback
        env:
          CXX: g++
          CC: gcc

      - name: Create distribution archive
        run:  meson dist -C dist --formats "xztar,zip" --no-tests --allow-dirty

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: JReleaser full-release
        uses: jreleaser/release-action@v2
        env:
          JRELEASER_PROJECT_VERSION: ${{ github.event.inputs.version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: JReleaser upload output
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: jreleaser-release
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
