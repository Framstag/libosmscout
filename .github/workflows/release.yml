name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (chronological, e.g. 2026.01.15.1); names the release and the distribution archives'
        required: true
      library_version:
        description: 'Library version of this release (major.minor.patch, e.g. 1.2.0); must differ from the current one and from the release version'
        required: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRO: 'zulu'

jobs:
  create_release:
    name: Create release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # the image workflow is dispatched from here, see the last step
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Install gcc compiler and Co
        run:  sudo apt-get -y install gcc g++ libtbb-dev ccache libtool pkg-config

      - name: Install meson and ninja via pip
        run:  "pip install meson ninja"

      - name: Set version
        run:  |
          VERSION=${{ github.event.inputs.version }}
          LIBRARY_VERSION=${{ github.event.inputs.library_version }}

          # The library version is declared once per build system. It is what
          # the import tool reports, what db.json records as import.version
          # and what the published container images are tagged with; it stays
          # three numeric components so the shared library major version does
          # not move. See Documentation/MapRepository.md, section 5.
          if ! echo "${LIBRARY_VERSION}" | grep -qE '^[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "library version '${LIBRARY_VERSION}' must have three numeric components (major.minor.patch)" >&2
            exit 1
          fi
          if [ "${LIBRARY_VERSION}" = "${VERSION}" ]; then
            echo "library version '${LIBRARY_VERSION}' must differ from the release version '${VERSION}'" >&2
            exit 1
          fi
          PREVIOUS_LIBRARY_VERSION=$(sed -nE 's/^set\(OSMSCOUT_LIBRARY_VERSION ([^)]*)\).*/\1/p' CMakeLists.txt)
          if [ -z "${PREVIOUS_LIBRARY_VERSION}" ]; then
            echo "could not read the current library version from CMakeLists.txt" >&2
            exit 1
          fi
          if [ "${LIBRARY_VERSION}" = "${PREVIOUS_LIBRARY_VERSION}" ]; then
            echo "library version '${LIBRARY_VERSION}' is unchanged from '${PREVIOUS_LIBRARY_VERSION}'; every release must establish its own library version" >&2
            exit 1
          fi

          # release version: names the release and the distribution archives
          sed -i "s/^ *version: *'[0-9a-z.-]*', *$/        version: '${VERSION}',/g" meson.build

          # library version: declared in both build systems, kept in step, and
          # the project version kept equal so the soname major follows it
          sed -i -E "s/^project\(libosmscout VERSION [0-9]+[.][0-9]+[.][0-9]+/project(libosmscout VERSION ${LIBRARY_VERSION}/" CMakeLists.txt
          sed -i -E "s/^set\(OSMSCOUT_LIBRARY_VERSION [^)]*\)/set(OSMSCOUT_LIBRARY_VERSION ${LIBRARY_VERSION})/" CMakeLists.txt
          sed -i -E "s/^libraryVersion='[0-9a-z.-]*'/libraryVersion='${LIBRARY_VERSION}'/" meson.build

          grep -qE "^project\(libosmscout VERSION ${LIBRARY_VERSION} " CMakeLists.txt
          grep -qE "^set\(OSMSCOUT_LIBRARY_VERSION ${LIBRARY_VERSION}\)" CMakeLists.txt
          grep -qE "^libraryVersion='${LIBRARY_VERSION}'" meson.build
          grep -qE "^        version: '${VERSION}'," meson.build

          echo "release ${VERSION}, library version ${LIBRARY_VERSION}"

      - name: Initialize meson project
        run:  meson setup dist --wrap-mode nofallback
        env:
          CXX: g++
          CC: gcc

      - name: Create distribution archive
        run:  meson dist -C dist --formats "xztar,zip" --no-tests --allow-dirty

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: JReleaser full-release
        uses: jreleaser/release-action@v2
        env:
          JRELEASER_PROJECT_VERSION: ${{ github.event.inputs.version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the container images for this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # The release is created above with the default token, and GitHub does
          # not start workflow runs for events caused by that token, so the
          # release event never reaches the image workflow. workflow_dispatch is
          # exempt from that rule, so the run is started explicitly - on the
          # released tag, so the images are built from the released source even
          # if master moves on meanwhile.
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" \
                  --jq "[.[] | select(.tag_name | endswith(\"${VERSION}\"))] | .[0].tag_name // empty")
          if [ -z "${tag}" ]; then
            # JReleaser's default tag naming, in case the lookup found nothing
            tag="v${VERSION}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha > /dev/null
          gh workflow run mapgen_image.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${tag}" \
            -f push=true \
            -f release=true \
            -f tag="${VERSION}"
          {
            echo "### Container images"
            echo
            echo "Dispatched the image workflow for \`${tag}\`: it publishes"
            echo "\`${VERSION}\`, the library version and \`latest\` once its"
            echo "build and smoke checks pass."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: JReleaser upload output
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: jreleaser-release
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
