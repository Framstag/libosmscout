# Main nginx configuration for the serve image.
#
# The master process runs as the unprivileged "nginx" user, so there is no
# "user" directive (that switch only applies to a root master) and all
# runtime state is placed under /tmp, which is world-writable and does not
# require special ownership.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    # temp areas: /tmp is world-writable, nginx creates these single-level
    # directories at startup (the parent must exist, hence no /tmp/nginx/ prefix)
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    include /etc/nginx/conf.d/*.conf;
}
