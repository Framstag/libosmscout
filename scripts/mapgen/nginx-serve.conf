# nginx configuration for serving the public part of the map repository.
#
# The repository volume is mounted at /repository and the served root is
# /repository/public — the private part (private/) lives beside it and is
# structurally unreachable: no rewrite or deny rules are needed.
#
# Anonymous read-only access; no login; no write endpoints.

server {
    listen 80;
    server_name _;

    root /repository/public;

    # region index
    location = /names.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    # database metadata
    location ~ /v[0-9]+/db\.json$ {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    # database files, large and immutable per version slot
    location ~ /v[0-9]+/ {
        add_header Cache-Control "public, max-age=86400, immutable";
        try_files $uri =404;
    }

    # everything else: 404, no directory listings
    location / {
        autoindex off;
        try_files $uri =404;
    }
}
