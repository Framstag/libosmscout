# Example nginx configuration for the map database repository.
#
# The repository volume is split at the top level:
#   /repository/public/    served root: names.json and
#                           <region-index-path>/v<version>/{db.json, files}
#   /repository/private/   never served: script-owned records (admin/),
#                           atomic replacement (staging/)
#
# Because the private part is structurally outside the served root, no
# deny rules are required. The served root is exactly the client-accessible
# surface: region index, per-database metadata, and database files.

server {
    listen 80;
    server_name maps.example.org;

    root /repository/public;

    # region index
    location = /names.json {
        default_type application/json;
    }

    # database metadata
    location ~ /v[0-9]+/db\.json$ {
        default_type application/json;
    }

    # everything else: database files
    location / {
        try_files $uri =404;
    }
}
