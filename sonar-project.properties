sonar.organization=framstag
sonar.projectKey=Framstag_libosmscout
sonar.host.url=https://sonarcloud.io

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/*.java,**/*.html,**/*.css
sonar.coverage.exclusions=**/*.java,**/*.html,**/*.css

# The map generation script verifies downloaded OSM extracts against the
# md5 sidecar file published by the download service (e.g. Geofabrik
# provides only an .md5 hash). md5 is used for data integrity, not
# security; the data provider offers no stronger hash. The choice is
# documented in scripts/mapgen/mapgen.sh.
#
# The basemap step uses md5 for the same purpose and one more: the content
# identity of its inputs (the pre-filtered planet export and the coastline
# archive) decides whether a basemap is rebuilt. The planet export is hashed
# once and its hash is also recorded in db.json as the source hash, and the
# coastline source publishes no checksum at all - a stronger hash is offered
# there as an optional configuration value and is used when set.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=shell:S4790
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/mapgen/mapgen.sh
sonar.issue.ignore.multicriteria.e2.ruleKey=shell:S4790
sonar.issue.ignore.multicriteria.e2.resourceKey=scripts/mapgen/mapgen-basemap.sh
sonar.issue.ignore.multicriteria.e3.ruleKey=shell:S4790
sonar.issue.ignore.multicriteria.e3.resourceKey=scripts/mapgen/basemap-check-test.sh

# The workflow files install apt packages by name and reference actions by tag, both
# deliberately: a release archive keeps only one version of a package, so a pinned
# version breaks the job on the next archive update, and an action reference stays on
# its major version so that the project receives the security fixes of that action.
# Both rules report the repository's whole workflow set, so the findings are not a
# property of a change that touches a dependency list or renames a file. Whether the
# workflows should pin what these rules ask for is open as #1929.
sonar.issue.ignore.multicriteria.e4.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e4.resourceKey=.github/workflows/**
sonar.issue.ignore.multicriteria.e5.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.e5.resourceKey=.github/workflows/**

# New public headers and their test companions repeat the mandatory LGPL
# license header and include guards; that boilerplate is not informative
# for the duplication metric on new code.
sonar.duplications.exclusions=libosmscout-import/include/osmscoutimport/DbJson.h,libosmscout-import/include/osmscoutimport/JsonWriter.h,libosmscout/include/osmscout/io/Crc32.h,Tests/src/DbJsonWriterTest.cpp,Tests/src/JsonWriterTest.cpp
